<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sury Saray · CEO</title>
  <meta name="description" content="Sury Saray · 15 años transformando tu belleza desde el interior.">
  <meta name="theme-color" content="#F3E3C9">

  <!-- Vista previa al compartir el enlace (WhatsApp, redes…) -->
  <meta property="og:title" content="Sury Saray · CEO">
  <meta property="og:description" content="15 años transformando tu belleza desde el interior.">
  <meta property="og:type" content="profile">
  <meta property="og:url" content="https://surysaray.com/">

  <!-- Fuente de respaldo por si Marlide Display no está disponible -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">

  <style>
    /* Marlide Display: si tienes el archivo de la fuente, súbelo junto a este HTML
       y descomenta este bloque ajustando el nombre del archivo. */
    /*
    @font-face {
      font-family: "Marlide Display";
      src: url("MarlideDisplay.woff2") format("woff2");
      font-display: swap;
    }
    */

    :root {
      --crema: #F3E3C9;
      --crema-claro: #FBF4E9;
      --terracota: #742D16;
      --chocolate: #4A1D0E;
      --texto-suave: rgba(74, 29, 14, 0.72);
      --linea: rgba(116, 45, 22, 0.16);
      --titulos: "Marlide Display", "Cormorant Garamond", Georgia, serif;
      --textos: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: var(--textos);
      color: var(--chocolate);
      background:
        radial-gradient(120% 60% at 50% 0%, var(--crema) 0%, var(--crema-claro) 70%);
      background-color: var(--crema-claro);
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    .tarjeta {
      width: 100%;
      max-width: 400px;
      text-align: center;
      animation: entrar .7s ease-out both;
    }

    @keyframes entrar {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: none; }
    }

    /* ---------- Foto / iniciales ---------- */
    .avatar {
      width: 124px;
      height: 124px;
      margin: 0 auto 20px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(145deg, var(--terracota), var(--chocolate));
      box-shadow: 0 12px 30px rgba(74, 29, 14, 0.22);
    }
    .avatar-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px solid var(--crema-claro);
      background: var(--crema);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: var(--titulos);
      font-size: 46px;
      letter-spacing: 2px;
      color: var(--terracota);
    }
    .avatar-inner img { width: 100%; height: 100%; object-fit: cover; }
    .avatar { position: relative; }
    .logo {
      position: absolute;
      right: -4px;
      bottom: -2px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 3px solid var(--crema-claro);
      background: var(--terracota);
      box-shadow: 0 4px 12px rgba(74, 29, 14, 0.3);
      object-fit: cover;
    }

    /* ---------- Nombre ---------- */
    h1 {
      font-family: var(--titulos);
      font-weight: 600;
      font-size: clamp(34px, 10vw, 42px);
      line-height: 1.05;
      color: var(--chocolate);
    }
    .cargo {
      margin-top: 8px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--terracota);
    }
    .separador {
      width: 40px;
      height: 1px;
      background: var(--terracota);
      margin: 18px auto;
      opacity: .5;
    }
    .frase {
      font-family: var(--titulos);
      font-style: italic;
      font-size: 19px;
      line-height: 1.35;
      color: var(--texto-suave);
      max-width: 290px;
      margin: 0 auto;
    }

    /* ---------- Botones principales ---------- */
    .acciones {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 28px 0 14px;
    }
    .accion {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 16px 6px 14px;
      border-radius: 18px;
      background: var(--terracota);
      color: var(--crema);
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .5px;
      box-shadow: 0 6px 16px rgba(116, 45, 22, 0.25);
      transition: transform .15s ease, background .2s ease;
    }
    .accion:hover { background: var(--chocolate); }
    .accion:active { transform: scale(.95); }
    .accion svg { width: 26px; height: 26px; }

    /* ---------- Guardar contacto ---------- */
    .guardar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 17px;
      border: 0;
      border-radius: 18px;
      background: var(--chocolate);
      color: var(--crema);
      font-family: var(--textos);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(74, 29, 14, 0.28);
      transition: transform .15s ease, opacity .2s ease;
    }
    .guardar:active { transform: scale(.98); }
    .guardar svg { width: 20px; height: 20px; }

    /* ---------- Enlaces secundarios ---------- */
    .enlaces {
      margin-top: 22px;
      border-top: 1px solid var(--linea);
    }
    .enlace {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 4px;
      border-bottom: 1px solid var(--linea);
      color: var(--chocolate);
      text-decoration: none;
      text-align: left;
      transition: padding .2s ease;
    }
    .enlace:active { padding-left: 10px; }
    .enlace .icono {
      flex: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--crema);
      color: var(--terracota);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .enlace .icono svg { width: 18px; height: 18px; }
    .enlace .txt { flex: 1; min-width: 0; }
    .enlace strong { display: block; font-size: 14px; font-weight: 500; }
    .enlace small {
      display: block;
      margin-top: 2px;
      font-size: 12px;
      color: var(--texto-suave);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .enlace .flecha { flex: none; width: 16px; height: 16px; color: var(--terracota); opacity: .6; }

    /* ---------- Horario ---------- */
    .horario {
      margin-top: 20px;
      font-size: 13px;
      color: var(--texto-suave);
      line-height: 1.6;
    }
    .estado {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      padding: 4px 12px;
      border-radius: 99px;
      background: var(--crema);
      font-size: 12px;
      font-weight: 500;
      color: var(--terracota);
    }
    .estado::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }
    .estado.abierto { color: #3c7a3a; }

    /* ---------- Compartir ---------- */
    .compartir {
      margin-top: 18px;
      background: none;
      border: 0;
      font-family: var(--textos);
      font-size: 13px;
      color: var(--terracota);
      text-decoration: underline;
      text-underline-offset: 4px;
      cursor: pointer;
    }

    .aviso {
      position: fixed;
      left: 50%;
      bottom: max(24px, env(safe-area-inset-bottom));
      transform: translate(-50%, 20px);
      padding: 10px 18px;
      border-radius: 99px;
      background: var(--chocolate);
      color: var(--crema);
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease, transform .25s ease;
    }
    .aviso.visible { opacity: 1; transform: translate(-50%, 0); }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

  <div class="aviso" id="aviso" role="status" aria-live="polite"></div>

  <script>
    // ---------- Datos del contacto (edítalos aquí si cambian) ----------
    const CONTACTO = {
      nombre: "Sury",
      apellidos: "Saray",
      empresa: "Sury Saray",
      cargo: "CEO",
      telefono: "+34622751697",
      email: "info@surysaray.com",
      web: "https://surysaray.com/",
      instagram: "https://www.instagram.com/sury.saray",
      instagram2: "https://www.instagram.com/surysarayauthorsbeauty",
      calle: "Na Caragol 36, local 5",
      ciudad: "Artà",
      region: "Mallorca",
      pais: "España",
      nota: "15 años transformando tu belleza desde el interior. Horario: lunes a viernes, 10:00 – 18:00 h."
    };

    const aviso = document.getElementById("aviso");
    function mostrarAviso(texto) {
      aviso.textContent = texto;
      aviso.classList.add("visible");
      clearTimeout(mostrarAviso.t);
      mostrarAviso.t = setTimeout(() => aviso.classList.remove("visible"), 2400);
    }

    // ---------- Guardar contacto (vCard .vcf) ----------
    function escapar(v) {
      return String(v).replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/([,;])/g, "\\$1");
    }

    function crearVCard(c) {
      return [
        "BEGIN:VCARD",
        "VERSION:3.0",
        `N:${escapar(c.apellidos)};${escapar(c.nombre)};;;`,
        `FN:${escapar(c.nombre + " " + c.apellidos)}`,
        `ORG:${escapar(c.empresa)}`,
        `TITLE:${escapar(c.cargo)}`,
        `TEL;TYPE=CELL,VOICE:${c.telefono}`,
        `EMAIL;TYPE=INTERNET,WORK:${c.email}`,
        `URL:${c.web}`,
        `X-SOCIALPROFILE;TYPE=instagram:${c.instagram}`,
        `X-SOCIALPROFILE;TYPE=instagram:${c.instagram2}`,
        `ADR;TYPE=WORK:;;${escapar(c.calle)};${escapar(c.ciudad)};${escapar(c.region)};;${escapar(c.pais)}`,
        `NOTE:${escapar(c.nota)}`,
        "END:VCARD"
      ].join("\r\n");
    }

    document.getElementById("guardarContacto").addEventListener("click", () => {
      const vcard = crearVCard(CONTACTO);
      const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "Sury-Saray.vcf";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
      mostrarAviso("Contacto descargado ✓");
    });

    // ---------- Abierto / cerrado (hora de Mallorca) ----------
    (function estadoHorario() {
      const el = document.getElementById("estado");
      try {
        const partes = new Intl.DateTimeFormat("en-GB", {
          timeZone: "Europe/Madrid", weekday: "short", hour: "2-digit", minute: "2-digit", hour12: false
        }).formatToParts(new Date());
        const get = t => partes.find(p => p.type === t).value;
        const dia = get("weekday");
        const minutos = parseInt(get("hour"), 10) * 60 + parseInt(get("minute"), 10);
        const laborable = ["Mon", "Tue", "Wed", "Thu", "Fri"].includes(dia);
        const abierto = laborable && minutos >= 600 && minutos < 1080;
        el.textContent = abierto ? "Abierto ahora" : "Cerrado ahora";
        el.classList.toggle("abierto", abierto);
      } catch (e) {
        el.style.display = "none";
      }
    })();

    // ---------- Compartir tarjeta ----------
    document.getElementById("compartir").addEventListener("click", async () => {
      const datos = {
        title: "Sury Saray · CEO",
        text: "Tarjeta de contacto de Sury Saray",
        url: location.href
      };
      if (navigator.share) {
        try { await navigator.share(datos); } catch (e) { /* cancelado */ }
        return;
      }
      try {
        await navigator.clipboard.writeText(location.href);
        mostrarAviso("Enlace copiado ✓");
      } catch (e) {
        mostrarAviso(location.href);
      }
    });
  </script>
